<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#201914" />
  <title>Lantern Road</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div>
        <h1>Lantern Road</h1>
        <p class="subtitle">A tabletop-style road campaign in one frontier region.</p>
      </div>
      <div class="header-actions">
        <button class="top-button" id="newGameBtn">New Campaign</button>
        <button class="top-button" id="saveBtn">Save Manual</button>
        <button class="top-button" id="loadBtn">Load…</button>
        <button class="top-button" id="accessibilityBtn" aria-label="Open Settings and Accessibility">⚙ Settings</button>
        <button class="top-button" id="fullscreenBtn">Fullscreen (F)</button>
        <div class="audio-controls" aria-label="Audio controls">
          <button class="top-button audio-toggle" id="soundToggleBtn" type="button" aria-pressed="false">Sound: Off</button>
          <button class="top-button audio-toggle" id="ambienceToggleBtn" type="button" aria-pressed="true" disabled>Ambience: On</button>
          <label class="volume-control" for="volumeSlider">
            <span>Vol</span>
            <input id="volumeSlider" type="range" min="0" max="1" step="0.05" value="0.28" disabled aria-label="Sound volume" />
          </label>
        </div>
        <span id="saveStatus" class="save-status" role="status" aria-live="polite">Autosave on · manual save separate</span>
      </div>
    </header>

    <section class="status-strip" id="statusStrip"></section>

    <main class="main-layout">
      <section class="map-panel panel">
        <div class="panel-head">
          <div>
            <h2>Grey March Map</h2>
            <p id="mapHint" class="muted">Tap a neighbouring hex to travel. Tap your current hex to focus it.</p>
          </div>
          <div class="map-buttons">
            <button id="focusHereBtn">Focus Here</button>
            <button id="campBtn">Camp</button>
            <button class="small" id="mapZoomOutBtn" aria-label="Zoom map out">−</button>
            <button class="small" id="mapResetBtn" aria-label="Centre map on party">Centre</button>
            <button class="small" id="mapZoomInBtn" aria-label="Zoom map in">+</button>
          </div>
        </div>
        <div class="canvas-wrap">
          <canvas id="mapCanvas" tabindex="0" aria-label="Interactive hex map of the Grey March" aria-describedby="mapHint"></canvas>
          <div id="nearbyTravel" class="nearby-travel" aria-label="Nearby travel options"></div>
        </div>
      </section>

      <section class="side-panel panel" id="sidePanel">
        <nav class="tabs" role="tablist" aria-label="Game information">
          <button class="tab active" role="tab" aria-selected="true" data-tab="context">Context</button>
          <button class="tab" role="tab" aria-selected="false" data-tab="journal">Journal</button>
          <button class="tab" role="tab" aria-selected="false" data-tab="party">Party</button>
          <button class="tab" role="tab" aria-selected="false" data-tab="log">Log</button>
        </nav>
        <div id="tabContent" class="tab-content" role="tabpanel"></div>
      </section>
    </main>
  </div>

  <div id="feedbackRoot" class="feedback-root" aria-live="polite" aria-atomic="true"></div>
  <div id="modalRoot" class="modal-root hidden" aria-live="polite"></div>

  <script src="content.js"></script>
  <script src="game.js"></script>
  <script src="https://parris-tech-services.github.io/WhirringWilderness/network/portal-adapter.js?v=3"></script>
  <script>PortalAdapter.init("lantern-road");</script>
</body>
</html>
