name: Wayfinder temporary overlap check

on:
  pull_request:
    branches: [main]

jobs:
  phone-overlap:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install temporary browser runner
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 >/tmp/lantern-road-http.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/lantern-road-http.log
          exit 1
      - name: Verify settings overlap and build ID across phone widths
        run: |
          node <<'NODE'
          const assert = require("node:assert/strict");
          const { chromium } = require("playwright");

          const overlaps = (a, b) =>
            a && b &&
            a.left < b.right &&
            a.right > b.left &&
            a.top < b.bottom &&
            a.bottom > b.top;

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const widths = [
              { width: 320, height: 700 },
              { width: 360, height: 780 },
              { width: 390, height: 844 },
              { width: 430, height: 900 }
            ];

            for (const size of widths) {
              const context = await browser.newContext({
                viewport: size,
                isMobile: true,
                hasTouch: true
              });
              const page = await context.newPage();
              const pageErrors = [];
              page.on("pageerror", error => pageErrors.push(String(error)));
              await page.route("**/portal-adapter.js*", route => route.fulfill({
                status: 200,
                contentType: "application/javascript",
                body: "window.PortalAdapter={init(){}};"
              }));

              await page.goto("http://127.0.0.1:4173/index.html", { waitUntil: "networkidle" });
              await page.getByRole("button", { name: "Set out from Hearthwick." }).click();

              await page.evaluate(() => {
                const gear = document.createElement("button");
                gear.id = "jup-reopen";
                gear.textContent = "⚙ Podcast settings";
                gear.style.cssText = "position:fixed;right:6px;bottom:6px;z-index:2147481999;padding:9px 12px";
                document.body.appendChild(gear);

                const dock = document.createElement("section");
                dock.id = "josh-universal-podcast";
                dock.style.cssText = "position:fixed;left:50%;bottom:5px;transform:translateX(-50%);height:58px;width:min(300px,calc(100vw - 10px));z-index:2147482000";
                dock.innerHTML = '<button type="button">Podcast action</button>';
                document.body.appendChild(dock);
              });

              const gearDisplay = await page.locator("#jup-reopen").evaluate(el => getComputedStyle(el).display);
              assert.equal(gearDisplay, "none", `floating settings gear should be hidden at ${size.width}px`);

              const tabs = page.locator(".tabs");
              const dock = page.locator("#josh-universal-podcast");
              assert.equal(await tabs.isVisible(), true, "thumb tabs should be visible");
              assert.equal(await dock.isVisible(), true, "simulated external dock should remain available");

              const tabRect = await tabs.evaluate(el => {
                const r = el.getBoundingClientRect();
                return { left:r.left, right:r.right, top:r.top, bottom:r.bottom };
              });
              const dockRect = await dock.evaluate(el => {
                const r = el.getBoundingClientRect();
                return { left:r.left, right:r.right, top:r.top, bottom:r.bottom };
              });
              assert.equal(overlaps(tabRect, dockRect), false, `external dock must clear thumb tabs at ${size.width}px`);

              await page.locator("#mapZoomInBtn").click();
              const feedbackRect = await page.locator("#feedbackRoot").evaluate(el => {
                const r = el.getBoundingClientRect();
                return { left:r.left, right:r.right, top:r.top, bottom:r.bottom };
              });
              assert.equal(overlaps(tabRect, feedbackRect), false, `feedback must not cover thumb tabs at ${size.width}px`);

              await page.locator("#accessibilityBtn").click();
              await page.getByRole("heading", { name: "Settings", exact: true }).waitFor();
              assert.equal(
                await page.locator(".settings-about").innerText().then(t => t.includes("2026.10.04-lr0009-v6")),
                true,
                "visible build ID should be present in Settings"
              );

              assert.equal(
                await dock.evaluate(el => getComputedStyle(el).visibility),
                "hidden",
                "external floating dock should be hidden while Settings modal is open"
              );

              await page.locator("[data-action='set-text-scale'][data-value='xlarge']").click();
              assert.equal(await page.locator("html").getAttribute("data-text-scale"), "xlarge");
              assert.equal(
                await page.locator("#feedbackRoot").evaluate(el => el.classList.contains("visible")),
                false,
                "Settings state changes should not create a floating toast over Settings controls"
              );

              const modal = page.locator(".settings-modal");
              const close = page.locator("[data-action='close-accessibility']");
              assert.equal(await modal.isVisible(), true);
              assert.equal(await close.isVisible(), true);
              const modalBox = await modal.boundingBox();
              const closeBox = await close.boundingBox();
              assert.ok(modalBox && closeBox);
              assert.ok(closeBox.x >= modalBox.x && closeBox.x + closeBox.width <= modalBox.x + modalBox.width,
                `Settings close button must stay inside modal horizontally at ${size.width}px with extra-large text`);
              assert.ok(closeBox.y >= 0 && closeBox.y + closeBox.height <= size.height,
                `Settings close button must stay inside the visible phone viewport at ${size.width}px with extra-large text`);

              const actionButtons = page.locator(".settings-modal button");
              const count = await actionButtons.count();
              for (let i = 0; i < count; i++) {
                const box = await actionButtons.nth(i).boundingBox();
                if (!box) continue;
                assert.ok(box.x >= -0.5 && box.x + box.width <= size.width + 0.5,
                  `Settings action ${i} must stay inside viewport at ${size.width}px`);
              }

              await page.screenshot({ path: `wayfinder-settings-${size.width}.png`, fullPage: false });
              await page.locator("[data-action='close-accessibility']").click();
              await page.screenshot({ path: `wayfinder-page-${size.width}.png`, fullPage: false });
              assert.deepEqual(pageErrors, [], `no uncaught errors expected at ${size.width}px`);
              await context.close();
            }

            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wayfinder-overlap-check
          path: wayfinder-*.png
          if-no-files-found: ignore
