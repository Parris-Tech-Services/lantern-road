name: Static runtime integrity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-static-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Validate app shell references, cache wiring and JavaScript syntax
        run: node scripts/validate-static-runtime.mjs
