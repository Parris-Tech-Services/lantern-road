name: DOM contract integrity

on:
  push:
    paths:
      - "index.html"
      - "game.js"
      - "src/**"
      - "scripts/validate-dom-contract.mjs"
      - ".github/workflows/dom-contract-integrity.yml"
  pull_request:
    paths:
      - "index.html"
      - "game.js"
      - "src/**"
      - "scripts/validate-dom-contract.mjs"
      - ".github/workflows/dom-contract-integrity.yml"

permissions:
  contents: read

jobs:
  validate-dom-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Validate DOM wiring and accessibility references
        run: node scripts/validate-dom-contract.mjs
