name: Wayfinder temporary LR-0009 current-main mobile check

on:
  push:
    branches:
      - agent/LR-0009-mobile-ux-64c3f2a1
  workflow_dispatch:

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node --check game.js
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run LR-0009 mobile reconciliation
        run: |
          node .github/tmp/lr0009-current-main.mjs | tee lr0009-current-main-result.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lr0009-current-main-result
          path: lr0009-current-main-result.txt
