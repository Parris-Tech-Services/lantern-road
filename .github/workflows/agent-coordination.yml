name: Agent coordination

on:
  push:
    paths:
      - "AGENTS.md"
      - ".agent-coordination/**"
      - "scripts/validate-agent-coordination.mjs"
      - "scripts/verify-pr-claim.mjs"
      - "scripts/verify-gate-evidence-ci.mjs"
      - "tests/verify-pr-claim.test.mjs"
      - ".github/workflows/agent-coordination.yml"
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate agent task coordination
        run: node scripts/validate-agent-coordination.mjs
      - name: Run PR claim verifier regression tests
        run: node --test tests/verify-pr-claim.test.mjs
      - name: Verify PR owns an active scope claim
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/verify-pr-claim.mjs
      - name: Verify evidence-gated completion against Actions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify-gate-evidence-ci.mjs
