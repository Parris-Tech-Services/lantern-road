name: AED report tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Test AED report calculations
        run: node --test tests/aed-report.test.mjs
      - name: Smoke AED report against repository state
        run: node scripts/aed-report.mjs --top 20
